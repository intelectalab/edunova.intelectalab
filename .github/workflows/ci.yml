# EDUN-204 · Integración continua: corre en cada pull request y en cada push a main.
# El despliegue a staging y producción se agrega con EDUN-203 (entornos en la nube).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Pest) y base de datos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edunova
          POSTGRES_USER: edunova
          POSTGRES_PASSWORD: edunova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunova -d edunova"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
      PGHOST: localhost
      PGUSER: edunova
      PGPASSWORD: edunova
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis, intl, zip, bcmath
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}

      - name: Dependencias de la API
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Roles y base de pruebas (igual que infra/postgres en local)
        run: |
          for f in infra/postgres/*.sql; do psql -d edunova -v ON_ERROR_STOP=1 -q -f "$f"; done

      - name: Configuración de la API
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Estilo de código PHP (Pint)
        working-directory: apps/api
        run: ./vendor/bin/pint --test

      - name: Pruebas de la API (Pest)
        working-directory: apps/api
        run: php artisan test

      - name: Auditoría de dependencias PHP
        working-directory: apps/api
        run: composer audit

      - name: Pruebas de aislamiento y reglas de la base (34)
        run: PSQL="psql" sh infra/pruebas-aislamiento.sh

      - name: Pruebas de reglas y permisos del CMS (17)
        run: PSQL="psql" sh infra/pruebas-cms.sh

  frontend:
    name: Web y sitio (tipos, lint, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Navegador para las pruebas de pantalla
        working-directory: apps/sitio
        run: pnpm exec playwright install --with-deps chromium
      - name: Pruebas de pantalla del sitio (Playwright + axe, 1440 y 390 px)
        working-directory: apps/sitio
        run: pnpm e2e
      - name: Auditoría de dependencias JS
        run: pnpm audit --prod
