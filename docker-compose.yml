# Entorno local de Edunova (docs/10-infraestructura.md del kit).
# Arranque: docker compose up -d   ·   API: http://localhost:8100/api/v1/salud
name: edunova

services:
  api:
    build: ./apps/api
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
    ports:
      - "${EDUNOVA_API_PUERTO:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  cola:
    # Procesa la cola (correo y trabajos de fondo). Reutiliza la imagen de la API.
    build: ./apps/api
    command: sh -c "php artisan queue:work --queue=correo,default --tries=5 --sleep=2"
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: edunova
      POSTGRES_USER: edunova
      POSTGRES_PASSWORD: edunova
      TZ: America/Lima
    ports:
      - "${EDUNOVA_PG_PUERTO:-5433}:5432"
    volumes:
      - postgres_datos:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edunova -d edunova"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${EDUNOVA_REDIS_PUERTO:-6379}:6379"

  s3:
    # Almacenamiento compatible con S3 para desarrollo (la imagen de MinIO ya no se publica).
    image: chrislusf/seaweedfs:latest
    # Con identidades configuradas el acceso anónimo queda denegado: el bucket es privado (EDUN-207).
    # Claves solo de desarrollo; en la nube vienen del gestor de secretos.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/identidades.json
    ports:
      - "${EDUNOVA_S3_PUERTO:-9000}:8333"
    volumes:
      - s3_datos:/data
      - ./infra/s3/identidades.json:/etc/seaweedfs/identidades.json:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${EDUNOVA_SMTP_PUERTO:-1026}:1025"
      - "${EDUNOVA_MAILPIT_PUERTO:-8026}:8025"

volumes:
  postgres_datos:
  s3_datos:
  api_vendor:
